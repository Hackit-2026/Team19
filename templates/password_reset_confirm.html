{% extends "base.html" %}
{% block title %}新しいパスワードの設定 - タイムラインカレンダー{% endblock %}
{% block content %}
<div class="auth-window">
  <h1>新しいパスワードの設定</h1>
  <form method="post">
    <label class="field-label">新しいパスワード(6文字以上)</label>
    <input class="field" type="password" name="password" required minlength="6" autofocus>
    <label class="field-label">新しいパスワード(確認用)</label>
    <input class="field" type="password" name="password2" required minlength="6">
    <button type="submit" class="btn btn-primary">パスワードを再設定する</button>
  </form>
</div>
{% endblock %}
