{% extends "base.html" %}
{% block title %}パスワードをお忘れの方 - タイムラインカレンダー{% endblock %}
{% block content %}
<div class="auth-window">
  <h1>パスワードをお忘れの方</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field-label">メールアドレス</label>
    <input class="field" type="email" name="email" required autofocus>
    <button type="submit" class="btn btn-primary">再設定用メールを送信する</button>
  </form>
  <div class="auth-links">
    <a href="{{ url_for('login') }}">ログイン画面へ戻る</a>
  </div>
  {% if config.DEV_MAILBOX_ENABLED %}<div class="demo-note">
    ローカルサーバーのため、実際のメールの代わりに <a href="{{ url_for('dev_mailbox') }}" target="_blank" rel="noopener">開発用メールボックス</a> に送信されます。
  </div>{% endif %}
</div>
{% endblock %}
