services:
  web:
    build: .
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in .env}"
      DATABASE_PATH: /data/demo.db
      DEV_MAILBOX_ENABLED: "${DEV_MAILBOX_ENABLED:-false}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      PORT: "${PORT:-5000}"
      TZ: "${TZ:-Asia/Tokyo}"
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '5000') + '/healthz').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  app-data:
